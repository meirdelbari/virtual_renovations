<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Generator - AlgoreitAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 480px;
        }
        .logo {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            text-align: center;
        }
        p {
            color: #64748b;
            text-align: center;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        input[type="url"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="url"]:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .note {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f1f5f9;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🤖</div>
        <h1>Create Supplier Demo</h1>
        <p>Enter a supplier's website URL to generate a live preview with AlgoreitAI integrated.</p>
        
        <form onsubmit="handleGenerate(event)">
            <div class="form-group">
                <label for="url">Website URL</label>
                <input type="url" id="url" placeholder="https://example-supplier.com" required>
            </div>
            <button type="submit">Generate Demo</button>
        </form>

        <div class="note">
            <strong>How it works:</strong> We'll create a temporary copy of their site and overlay the "AlgoreitAI" button, just like it would look if they installed our widget.
        </div>
    </div>

    <script>
        function handleGenerate(e) {
            e.preventDefault();
            const urlInput = document.getElementById('url');
            let url = urlInput.value.trim();
            
            if (!url) return;
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // Redirect to the proxy endpoint (cache-busted)
            window.location.href = `/api/demo-proxy?url=${encodeURIComponent(url)}&t=${Date.now()}`;
        }
    </script>
</body>
</html>
